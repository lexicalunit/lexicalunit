name: Metrics

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lexicalunit
          filename: github-metrics.svg
          template: classic
          base: "header, activity, community, repositories"

          # Compute activity stats over the whole account lifetime instead of
          # GitHub's default trailing-365-day contributionsCollection window.
          base_indepth: yes

          config_timezone: America/Los_Angeles
          config_display: columns

          # imgb64() builds data URIs as `image/${ext}`, and file-type reports
          # "jpg" for JPEGs, so avatars come out labelled `data:image/jpg` --
          # not a registered MIME type. Browsers sniff past it, stricter
          # renderers show a broken image. Runs in-page just before the SVG is
          # serialized, so the correction persists into the output.
          extras_js: |
            document.querySelectorAll('img[src^="data:image/jpg;base64,"]').forEach(img => {
              img.setAttribute("src", img.getAttribute("src").replace("data:image/jpg;", "data:image/jpeg;"))
            })

          # NB: the "recently-used" section crashes the whole run when any
          # PushEvent in the feed has no payload.commits (upstream bug in
          # plugins/languages/analyzer/recent.mjs). Leave it off.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          # Contribution calendar, current year only.
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # Lines of code added/removed.
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 4

          # nanodbc/nanodbc lives under the nanodbc org, so it never reaches
          # the Repositories section (that only counts owned repos, and
          # ownerAffiliations: ORGANIZATION_MEMBER is all-or-nothing). Feature
          # it explicitly instead.
          plugin_repositories: yes
          plugin_repositories_featured: nanodbc/nanodbc

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
