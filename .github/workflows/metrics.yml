name: Metrics

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lexicalunit
          filename: github-metrics.svg
          template: classic
          base: "header, activity, community, repositories"

          # Compute activity stats over the whole account lifetime instead of
          # GitHub's default trailing-365-day contributionsCollection window.
          base_indepth: yes

          config_timezone: America/Los_Angeles
          config_display: columns

          # Languages: most-used (all time) plus what I've actually touched lately.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage
          plugin_languages_recent_days: 30

          # Isometric contribution calendar.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Full contribution history, every year since 2012.
          plugin_calendar: yes
          plugin_calendar_limit: 0

          # Coding habits: active hours/days, indent style, recent languages.
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Contributions to repos I don't own (nanodbc downstreams, OSS, etc).
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request

          # Lines of code added/removed.
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_lines_repositories_limit: 4

          # Issue/PR follow-up ratios, mine and on my repos.
          plugin_followup: yes
          plugin_followup_sections: repositories, user

          # Stars over time.
          plugin_stargazers: yes
          plugin_stargazers_charts_type: graph

          # Topic icons from starred repos.
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 15

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B

          plugin_stars: no
